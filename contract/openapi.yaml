    post:
      operationId: createAthlete
      tags: [Athletes]
      summary: Create an athlete.
      description: |
        Creates an athlete. Requires scope `athletes:create`. Both Admin/Management and
        Coach/Staff tokens may create athletes (matching the web picker's behaviour).

        **`waiver_signed` is read-only and cannot be set by any scope** and is therefore
        not accepted in the body. `notes` is honoured only for Admin/Management tokens.

        **Idempotency:** the `Idempotency-Key` header is **required** (same semantics as
        `POST /lessons`).

        The created athlete is returned in the field-visibility view appropriate to the
        caller's role.
      x-required-scopes: [athletes:create]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS -X POST https://scorsync.example.com/api/v1/athletes \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'Idempotency-Key: c7e2a940-3b16-4f8e-9d02-5a1f8c3b7e64' \
              -d '{"first_name": "Ava", "last_name": "Reyes", "membership_status": "member"}'
      parameters:
