  /pricing-quotes:
    get:
      operationId: getPricingQuote
      tags: [Pricing]
      summary: Get an advisory facility-fee quote.
      description: |
        Returns a server-computed facility fee for a prospective lesson: `cost_cents`,
        membership determination (all-athletes-enrolled rule), `is_late_booking`, and a
        human-readable breakdown. Read-only, no side effects. Requires scope `lessons:read`.

        **Advisory, not binding.** A quote is not deterministic over time (membership can
        change; `is_late_booking` flips once the scheduled time passes), so the response
        includes `quoted_at` and is labelled advisory. **The fee is always recalculated at
        create time** — the quote is never trusted as the source of truth. There is no quote
        token and no `QUOTE_EXPIRED` code: the create path accepts no quote to expire.
      x-required-scopes: [lessons:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            # athlete_ids repeats the bare key once per athlete (style: form,
            # explode: true). The PHP-native `athlete_ids[]=12` form is also
            # accepted, so either serializer works.
            curl -sS -G https://scorsync.example.com/api/v1/pricing-quotes \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Accept: application/json' \
              --data-urlencode 'duration=60' \
              --data-urlencode 'athlete_ids=12' \
              --data-urlencode 'athlete_ids=13' \
              --data-urlencode 'scheduled_at=2026-08-04T14:00:00-07:00'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - name: duration
          in: query
          required: true
          description: Lesson duration in minutes.
          schema:
            $ref: '#/components/schemas/DurationMinutes'
          example: 60
        - name: athlete_ids
          in: query
          required: true
          description: Athlete ids on the prospective lesson (used for the all-enrolled membership rule).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
            minItems: 1
        - name: scheduled_at
          in: query
          required: true
          description: >-
            Prospective start time. RFC 3339 with an explicit offset is required;
            naive/offset-less input is rejected with 422 VALIDATION_FAILED.
          schema:
            $ref: '#/components/schemas/Rfc3339DateTime'
      responses:
        '200':
          description: An advisory pricing quote.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PricingQuote'
              examples:
