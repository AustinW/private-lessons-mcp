      summary: Per-coach unpaid facility fees owed to the gym.
      description: |
        Returns per-coach **unpaid facility fees that the coach owes the gym** — money the
        coach owes the gym, **not** money families owe the coach. Requires scope
        `balances:read`. Coach/Staff see their own balance; Admin/Management see all.

        Amounts are computed from `effectiveCostCents()` (honouring `cost_override_cents`
        and `late_fee_waived`), never raw `cost_cents`.
      x-required-scopes: [balances:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS https://scorsync.example.com/api/v1/balances \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
