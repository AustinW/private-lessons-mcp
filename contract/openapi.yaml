  responses:
    Forbidden:
      description: >-
        Authenticated but not permitted. `INSUFFICIENT_SCOPE` (token lacks the required
        scope) or `FORBIDDEN` (scope present but policy denies).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            insufficient_scope:
              summary: Token lacks the required scope.
              value:
                type: https://scorsync.example.com/errors/insufficient-scope
                title: Insufficient scope
                status: 403
                detail: This token is missing the required scope 'lessons:write'.
                code: INSUFFICIENT_SCOPE
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
            forbidden:
              summary: Policy denies the action for this user.
              value:
                type: https://scorsync.example.com/errors/forbidden
                title: Forbidden
                status: 403
                detail: You do not have permission to perform this action.
                code: FORBIDDEN
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
    NotFound:
      description: The referenced resource does not exist (or is not visible to the caller).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            lesson_not_found:
              summary: No such lesson.
              value:
                type: https://scorsync.example.com/errors/lesson-not-found
                title: Lesson not found
                status: 404
                detail: No lesson with id 9999 is visible to this token.
                code: LESSON_NOT_FOUND
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
            athlete_not_found:
              summary: An athlete id in the request does not exist.
              value:
                type: https://scorsync.example.com/errors/athlete-not-found
                title: Athlete not found
                status: 404
                detail: Athlete id 512 does not exist. Create it with POST /athletes first.
                code: ATHLETE_NOT_FOUND
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
    SlotConflict:
      description: >-
        The coach already has a lesson overlapping the requested window (`SLOT_CONFLICT`).
        Not retryable — change the time or coach.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/SlotConflictProblem'
          examples:
            slot_conflict:
              summary: The coach already has a lesson overlapping this window.
              value:
                type: https://scorsync.example.com/errors/slot-conflict
                title: Lesson conflicts with an existing booking
                status: 409
                detail: Coach already has a lesson from 2:00 PM to 3:00 PM Pacific.
                code: SLOT_CONFLICT
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  scheduled_at:
                    - This time overlaps an existing lesson.
    IdempotencyConflict:
      description: >-
        An `Idempotency-Key` conflict (`IDEMPOTENCY_KEY_REUSED`). Covers both a
        same-key/different-body reuse (`retryable: false`) and a concurrent same-key request
        still in progress (`retryable: true`, with `Retry-After`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            idempotency_key_reused:
              summary: Same Idempotency-Key replayed with a different body.
              value:
                type: https://scorsync.example.com/errors/idempotency-key-reused
                title: Idempotency key reused with a different request
                status: 409
                detail: This Idempotency-Key was already used with a different request body.
                code: IDEMPOTENCY_KEY_REUSED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
            request_in_progress:
              summary: A request with this Idempotency-Key is still in flight.
              value:
                type: https://scorsync.example.com/errors/idempotency-key-reused
                title: A request with this Idempotency-Key is in progress
                status: 409
                detail: The original request is still being processed. Retry after a short delay.
                code: IDEMPOTENCY_KEY_REUSED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: true
    LessonCreateConflict:
      description: >-
        A create-lesson conflict: either `SLOT_CONFLICT` (coach already booked in the window,
        `retryable: false`) or `IDEMPOTENCY_KEY_REUSED` (same-key/different-body reuse,
        `retryable: false`; or a concurrent in-progress request, `retryable: true` with
        `Retry-After`). Generated clients should model both codes in the 409 error union.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SlotConflictProblem'
              - $ref: '#/components/schemas/IdempotencyConflictProblem'
          examples:
            slot_conflict:
              summary: The coach already has a lesson overlapping this window.
              value:
                type: https://scorsync.example.com/errors/slot-conflict
                title: Lesson conflicts with an existing booking
                status: 409
                detail: Coach already has a lesson from 2:00 PM to 3:00 PM Pacific.
                code: SLOT_CONFLICT
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  scheduled_at:
                    - This time overlaps an existing lesson.
            idempotency_key_reused:
              summary: Same Idempotency-Key replayed with a different body.
              value:
                type: https://scorsync.example.com/errors/idempotency-key-reused
                title: Idempotency key reused with a different request
                status: 409
                detail: This Idempotency-Key was already used with a different request body.
                code: IDEMPOTENCY_KEY_REUSED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
            request_in_progress:
              summary: A request with this Idempotency-Key is still in flight.
              value:
                type: https://scorsync.example.com/errors/idempotency-key-reused
                title: A request with this Idempotency-Key is in progress
                status: 409
                detail: The original request is still being processed. Retry after a short delay.
                code: IDEMPOTENCY_KEY_REUSED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: true
    PreconditionFailed:
      description: >-
        The `If-Match` ETag did not match the current lesson version. The current version
        is returned in `current_version`; re-fetch, re-apply, and retry with a fresh
        `If-Match`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            version_mismatch:
              summary: Stale If-Match.
              value:
                type: https://scorsync.example.com/errors/version-mismatch
                title: Lesson version mismatch
                status: 412
                detail: The lesson was modified since you last read it. Current version is 5.
                code: VERSION_MISMATCH
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                current_version: 5
    UnprocessableEntity:
      description: >-
        The request was well-formed but failed validation or a business rule.
        `VALIDATION_FAILED` (including missing required `Idempotency-Key`/`If-Match`, or a
        naive/offset-less timestamp), `OUTSIDE_BUSINESS_HOURS`, `FACILITY_FEE_ACK_REQUIRED`,
        or `LATE_BOOKING_ACK_REQUIRED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation_failed:
              summary: Field-level validation failed (here, a naive timestamp).
              value:
                type: https://scorsync.example.com/errors/validation-failed
                title: Validation failed
                status: 422
                detail: One or more fields are invalid.
                code: VALIDATION_FAILED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  scheduled_at:
                    - A timezone offset is required, e.g. 2026-08-04T14:00:00-07:00.
            outside_business_hours:
              summary: The requested time is outside 07:00-22:00 Pacific.
              value:
                type: https://scorsync.example.com/errors/outside-business-hours
                title: Outside business hours
                status: 422
                detail: Lessons may only be booked between 07:00 and 22:00 Pacific.
                code: OUTSIDE_BUSINESS_HOURS
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  scheduled_at:
                    - Start time must be between 07:00 and 22:00 Pacific.
            facility_fee_ack_required:
              summary: fee_acknowledged was not true.
              value:
                type: https://scorsync.example.com/errors/facility-fee-ack-required
                title: Facility fee acknowledgement required
                status: 422
                detail: You must acknowledge the facility fee (fee_acknowledged=true) to book.
                code: FACILITY_FEE_ACK_REQUIRED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  fee_acknowledged:
                    - This field must be true.
            late_booking_ack_required:
              summary: A late booking was not acknowledged.
              value:
                type: https://scorsync.example.com/errors/late-booking-ack-required
                title: Late-booking acknowledgement required
                status: 422
                detail: This is a late booking; set late_booking_acknowledged=true to proceed.
                code: LATE_BOOKING_ACK_REQUIRED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: false
                errors:
                  late_booking_acknowledged:
                    - This field must be true for a late booking.
    RateLimited:
      description: The per-token rate limit was exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rate_limited:
              summary: Too many requests.
              value:
                type: https://scorsync.example.com/errors/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit exceeded. Retry after the interval in Retry-After.
                code: RATE_LIMITED
                request_id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
                retryable: true

  schemas:
    ErrorCode:
      type: string
      description: |
        The fixed application error-code taxonomy. **Exactly these 13 values** — no others.
        (`ATHLETE_AMBIGUOUS` is **client-surfaced**: the server always returns a plain 200
        candidate list from `GET /athletes`; a client/CLI/MCP resolving a name to a single
        athlete raises it when the search returns more than one match. The server never sets
        it as an HTTP status, and it is never a write error. No operation emits it in a
        problem document.)
      enum:
        - VALIDATION_FAILED
        - ATHLETE_NOT_FOUND
        - ATHLETE_AMBIGUOUS
        - LESSON_NOT_FOUND
        - SLOT_CONFLICT
        - OUTSIDE_BUSINESS_HOURS
        - VERSION_MISMATCH
        - IDEMPOTENCY_KEY_REUSED
        - INSUFFICIENT_SCOPE
        - FORBIDDEN
        - RATE_LIMITED
        - FACILITY_FEE_ACK_REQUIRED
        - LATE_BOOKING_ACK_REQUIRED

    Scope:
      type: string
      description: A Sanctum token ability (scope).
      enum:
        - lessons:read
        - lessons:write
        - lessons:cancel
        - lessons:mark-paid
        - athletes:read
        - athletes:create
        - balances:read
        - audit:read

    DurationMinutes:
      type: integer
      description: >-
        Lesson duration in minutes. The current conflict window supports up to 120.
        `45` is included because the application has always accepted it (the web
        create/update validation is `in:30,45,60,90,120`) and existing rows use it;
        its omission from the original Phase 1 enum was an error in this document, not
        a data problem.
      enum: [30, 45, 60, 90, 120]

    MembershipStatus:
      type: string
      description: Athlete membership status.
      enum:
        - unknown
        - member
        - not_member

    Source:
      type: string
      description: The originating surface of a write, recorded on the audit event.
      enum:
        - web
        - api
        - filament
        - console

    Rfc3339DateTime:
      type: string
      format: date-time
      description: >-
        RFC 3339 timestamp with an **explicit UTC offset that is required on input and
        always present on output** (e.g. `2026-08-04T14:00:00-07:00`). Naive / offset-less
        input is rejected with 422 VALIDATION_FAILED. Output is always emitted with an
        explicit Pacific (`America/Los_Angeles`) offset.


        Input is validated as **strict RFC 3339**, not "anything a date parser accepts":
        seconds are required (`...T14:00Z` is ISO 8601, not RFC 3339), the offset must be
        `Z` or `±HH:MM` (the basic forms `+0200` / `+02` are rejected), and an impossible
        date or time (`2026-02-30`, `14:60:00`) is rejected rather than rolled over. `T`/`t`
        and `Z`/`z` are both accepted — ABNF literals are case-insensitive.
      examples:
        - '2026-08-04T14:00:00-07:00'

    ProblemDetails:
      type: object
      description: RFC 9457 problem detail. Served as `application/problem+json`.
      required:
        - type
        - title
        - status
        - code
        - request_id
        - retryable
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type.
          examples:
            - https://scorsync.example.com/errors/slot-conflict
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        request_id:
          type: string
          description: Correlation id; matches the `X-Request-Id` response header.
        retryable:
          type: boolean
          description: >-
            Whether an identical retry may succeed later (e.g. rate limiting or an
            in-progress idempotent request). Definitive client errors are not retryable.
        errors:
          type:
            - object
            - 'null'
          description: Field-level validation messages, keyed by field name.
          additionalProperties:
            type: array
            items:
              type: string
        current_version:
          type:
            - integer
            - 'null'
          description: On VERSION_MISMATCH (412), the lesson's current version.

    SlotConflictProblem:
      description: >-
        A `ProblemDetails` whose `code` is constrained to `SLOT_CONFLICT`, so a generated
        client's 409 error type for this response is exactly that one code.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            code:
              const: SLOT_CONFLICT

    IdempotencyConflictProblem:
      description: >-
        A `ProblemDetails` whose `code` is constrained to `IDEMPOTENCY_KEY_REUSED`, so a
        generated client's 409 error type for this response is exactly that one code.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            code:
              const: IDEMPOTENCY_KEY_REUSED

    AthleteRef:
      type: object
      description: Minimal athlete reference embedded in a lesson (safe for every role).
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name (`first_name last_name`).

    AthleteCoachView:
      type: object
      description: >-
        Athlete as seen by a Coach/Staff token. **Exactly these four fields** — never
        `notes` or other metadata (enforced by API Resources).
      additionalProperties: false
      required: [id, name, waiver_signed, membership_status]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name (`first_name last_name`).
        waiver_signed:
          type: boolean
          description: Read-only; no scope can set it.
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'

    AthleteAdminView:
      type: object
      description: Athlete as seen by an Admin/Management token (full record, including notes).
      required: [id, name, first_name, last_name, waiver_signed, membership_status, notes, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name (`first_name last_name`).
        first_name:
          type: string
        last_name:
          type: string
        waiver_signed:
          type: boolean
          description: Read-only; no scope can set it.
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        notes:
          type:
            - string
            - 'null'
          description: Admin/Management only; never serialized to a coach token.
        created_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        updated_at:
          $ref: '#/components/schemas/Rfc3339DateTime'

    Athlete:
      description: >-
        An athlete. The serialized shape depends on the caller's role, not scope:
        Admin/Management receive `AthleteAdminView` (with `notes`); Coach/Staff receive
        `AthleteCoachView` (no `notes`).
      oneOf:
        - $ref: '#/components/schemas/AthleteAdminView'
        - $ref: '#/components/schemas/AthleteCoachView'

    Lesson:
      type: object
      description: A private lesson.
      required:
        - id
        - coach_id
        - athletes
        - scheduled_at
        - duration_minutes
        - is_member
        - is_late_booking
        - cost_cents
        - effective_cost_cents
        - late_fee_waived
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        coach_id:
          type: integer
          description: The lesson's staff (coach) user id. Distinct from the acting user.
        coach_name:
          type:
            - string
            - 'null'
        athletes:
          type: array
          description: Athletes on the lesson (may be empty only for legacy Filament/console records).
          items:
            $ref: '#/components/schemas/AthleteRef'
        student_name:
          type:
            - string
            - 'null'
          description: Legacy free-text student name for athlete-less records; null when athletes are attached.
        scheduled_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        duration_minutes:
          $ref: '#/components/schemas/DurationMinutes'
        is_member:
          type: boolean
          description: Membership determination at booking time (all-athletes-enrolled rule).
        is_late_booking:
          type: boolean
        observer:
          type:
            - string
            - 'null'
        notes:
          type:
            - string
            - 'null'
        cost_cents:
          type: integer
          description: Raw stored facility fee in cents, before override/waiver.
        effective_cost_cents:
          type: integer
          description: >-
            The authoritative amount owed, via `effectiveCostCents()` (honours
            `cost_override_cents` and `late_fee_waived`). Balances aggregate this, never
            `cost_cents`.
        cost_override_cents:
          type:
            - integer
            - 'null'
        cost_override_reason:
          type:
            - string
            - 'null'
        late_fee_waived:
          type: boolean
        paid_at:
          oneOf:
            - $ref: '#/components/schemas/Rfc3339DateTime'
            - type: 'null'
          description: When the lesson was marked paid; null if unpaid.
        cancelled_at:
          oneOf:
            - $ref: '#/components/schemas/Rfc3339DateTime'
            - type: 'null'
          description: Soft-delete timestamp; null unless cancelled.
        version:
          type: integer
          description: Optimistic-concurrency version. Drives the strong ETag `"lesson-<id>-v<version>"`.
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        updated_at:
          $ref: '#/components/schemas/Rfc3339DateTime'

    PricingQuote:
      type: object
      description: Advisory facility-fee quote. Never binding; recalculated at create time.
      required:
        - duration_minutes
        - athlete_ids
        - scheduled_at
        - is_member
        - is_late_booking
        - cost_cents
        - currency
        - hourly_rate_cents
        - late_multiplier_applied
        - breakdown
        - quoted_at
        - advisory
      properties:
        duration_minutes:
          $ref: '#/components/schemas/DurationMinutes'
        athlete_ids:
          type: array
          items:
            type: integer
        scheduled_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        is_member:
          type: boolean
          description: All-athletes-enrolled membership determination.
        is_late_booking:
          type: boolean
        cost_cents:
          type: integer
          description: Computed facility fee in cents.
        currency:
          type: string
          const: USD
        hourly_rate_cents:
          type: integer
          description: 1000 for members, 2000 for non-members.
        late_multiplier_applied:
          type: boolean
          description: Whether the x2 late surcharge was applied.
        breakdown:
          type: string
          description: Human-readable explanation of the computed fee.
        quoted_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        advisory:
          type: boolean
          const: true
          description: Always true. The fee is recalculated at create; this quote is not trusted as truth.

    Availability:
      type: object
      description: Bookable windows for a coach on a date, in America/Los_Angeles.
      required:
        - date
        - coach_id
        - duration_minutes
        - timezone
        - business_hours
        - slots
      properties:
        date:
          type: string
          format: date
        coach_id:
          type: integer
        coach_name:
          type:
            - string
            - 'null'
        duration_minutes:
          $ref: '#/components/schemas/DurationMinutes'
        timezone:
          type: string
          const: America/Los_Angeles
        business_hours:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              description: Local (Pacific) business-hours start, HH:MM.
              examples: ['07:00']
            end:
              type: string
              description: Local (Pacific) business-hours end, HH:MM.
              examples: ['22:00']
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    AvailabilitySlot:
      type: object
      required: [start, end, is_late_booking]
      properties:
        start:
          $ref: '#/components/schemas/Rfc3339DateTime'
        end:
          $ref: '#/components/schemas/Rfc3339DateTime'
        is_late_booking:
          type: boolean
          description: True if starting a lesson at this slot counts as a late booking.

    Balance:
      type: object
      description: >-
        Unpaid facility fees a coach owes the gym (computed from `effectiveCostCents()`).
        This is money the coach owes the gym, NOT money families owe the coach.
      required: [coach_id, unpaid_cents, currency, unpaid_lesson_count]
      properties:
        coach_id:
          type: integer
        coach_name:
          type:
            - string
            - 'null'
        unpaid_cents:
          type: integer
          description: Sum of `effective_cost_cents` over the coach's unpaid lessons.
        currency:
          type: string
          const: USD
        unpaid_lesson_count:
          type: integer

    CursorPageMeta:
      type: object
      description: >-
        Keyset-pagination state for one page. `next_cursor` is opaque — pass it back
        verbatim as the `cursor` query parameter; never construct or parse one.
      required: [limit, has_more, next_cursor]
      properties:
        limit:
          type: integer
          description: The page size actually applied (the request's `limit`, or the default).
          minimum: 1
          maximum: 200
        has_more:
          type: boolean
          description: True when at least one further page exists.
        next_cursor:
          type:
            - string
            - 'null'
          description: Cursor for the next page; null on the last page.

    AuditEvent:
      type: object
      description: An append-only audit event. Never updated or deleted.
      required:
        - id
        - actor_type
        - source
        - action
        - auditable_type
        - auditable_id
        - changes
        - request_id
        - created_at
      properties:
        id:
          type: string
          description: ULID.
        actor_id:
          type:
            - integer
            - 'null'
        actor_type:
          type:
            - string
            - 'null'
          description: >-
            Morph class of the actor. **Null for a console-sourced write**, which has no
            user actor — the key is always present, the value is not fabricated.
        token_id:
          type:
            - integer
            - 'null'
          description: Nullable; a revoked token sets this null (ON DELETE SET NULL) rather than deleting history.
        token_fingerprint:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/Source'
        action:
          type: string
          description: e.g. `lesson.created`, `lesson.cancelled`, `athlete.created`.
        auditable_type:
          type: string
        auditable_id:
          type:
            - string
            - 'null'
        changes:
          type: object
          description: JSON diff / recorded facts (includes acknowledgement facts on lesson creates).
          additionalProperties: true
        request_id:
          type:
            - string
            - 'null'
          description: >-
            Correlation id of the request that caused the write. **Null when there was no
            HTTP request** (console/scheduled writes); null truthfully means "no
            correlation existed" and is never replaced with a generated id.
        ip:
          type:
            - string
            - 'null'
        user_agent:
          type:
            - string
            - 'null'
        created_at:
          $ref: '#/components/schemas/Rfc3339DateTime'

    Me:
      type: object
      description: The authenticated identity and the current token's granted scopes.
      required: [id, name, email, roles, scopes, token]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
          description: e.g. Admin, Management, Staff, Coach.
        scopes:
          type: array
          description: Abilities granted to the current token.
          items:
            $ref: '#/components/schemas/Scope'
        token:
          $ref: '#/components/schemas/TokenInfo'

    TokenInfo:
      type: object
      description: Non-secret metadata about the current token. The secret is never returned.
      required: [id, name, fingerprint]
      properties:
        id:
          type: integer
        name:
          type: string
        fingerprint:
          type: string
          description: Non-secret display prefix (first 6 chars of the random part), e.g. `a1b2c3`.
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Rfc3339DateTime'
            - type: 'null'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Rfc3339DateTime'
            - type: 'null'

    CreateLessonRequest:
      type: object
      description: >-
        Create-lesson body. There is deliberately **no athlete name field** — only
        `athlete_ids`. Server computes membership and cost; clients never send a fee.
      additionalProperties: false
      required:
        - coach_id
        - athlete_ids
        - scheduled_at
        - duration_minutes
        - fee_acknowledged
      properties:
        coach_id:
          type: integer
          description: The lesson's staff (coach). Distinct from the acting user; the actor is authorized to book for this coach.
        athlete_ids:
          type: array
          description: Athlete ids on the lesson. Required and non-empty on the API. (The empty-array tolerance is a filament/console-only path, not exposed here.)
          items:
            type: integer
          minItems: 1
        scheduled_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        duration_minutes:
          $ref: '#/components/schemas/DurationMinutes'
        fee_acknowledged:
          type: boolean
          description: >-
            Must be sent as `true`; a missing or `false` value is rejected with 422
            FACILITY_FEE_ACK_REQUIRED. Recorded in the audit event.
        late_booking_acknowledged:
          type: boolean
          default: false
          description: Must be `true` when the booking is late; else 422 LATE_BOOKING_ACK_REQUIRED. Recorded in the audit event.
        notes:
          type:
            - string
            - 'null'
        observer:
          type:
            - string
            - 'null'

    UpdateLessonRequest:
      type: object
      description: >-
        Partial update. **No athlete name field** — reassign via `athlete_ids`. An omitted
        field is left unchanged; a field sent as `null` clears it (nullable fields only).
        All fields optional; `If-Match` is required at the header level.
      additionalProperties: false
      properties:
        coach_id:
          type: integer
        athlete_ids:
          type: array
          items:
            type: integer
          minItems: 1
        scheduled_at:
          $ref: '#/components/schemas/Rfc3339DateTime'
        duration_minutes:
          $ref: '#/components/schemas/DurationMinutes'
        notes:
          type:
            - string
            - 'null'
          description: Omit to leave unchanged; send null to clear.
        observer:
          type:
            - string
            - 'null'
          description: Omit to leave unchanged; send null to clear.
        late_booking_acknowledged:
          type: boolean
          description: Required true when the update moves the lesson to a late start; else 422 LATE_BOOKING_ACK_REQUIRED.

    CancelLessonRequest:
      type: object
      description: Optional cancel body. `If-Match` is required at the header level.
      additionalProperties: false
      properties:
        reason:
          type:
            - string
            - 'null'
          description: Optional human-readable cancellation reason (recorded in the audit event).

    MarkLessonPaidRequest:
      type: object
      description: Optional mark-paid body. `If-Match` is required at the header level.
      additionalProperties: false
      properties:
        paid_at:
          oneOf:
            - $ref: '#/components/schemas/Rfc3339DateTime'
            - type: 'null'
          description: Payment time; defaults to now (server time) when omitted or null.

    CreateAthleteRequest:
      type: object
      description: >-
        Create-athlete body. `waiver_signed` is intentionally **not** accepted — waiver
        status is read-only through every scope. `notes` is honoured for Admin/Management
        only.
      additionalProperties: false
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        notes:
          type:
            - string
            - 'null'
          description: Admin/Management only; ignored for Coach/Staff tokens (which cannot read notes).
