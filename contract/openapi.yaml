  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      summary: List audit events (Admin only).
      description: |
        Returns the append-only audit log, newest first (`created_at` then `id`, both
        descending). Requires scope `audit:read` **and** an Admin-only policy — a
        non-Admin token with `audit:read` still receives `403` `FORBIDDEN`.

        **Cursor pagination.** The log only ever grows, so the read is bounded: at most
        `limit` events (default 50, maximum 200) are returned per call. Paging uses an
        opaque **keyset cursor** over the same `(created_at, id)` ordering, not an offset —
        rows are continually appended, and an offset page would repeat or skip a row as
        soon as a write landed between two requests.

        Follow `meta.next_cursor` while `meta.has_more` is true, passing it back verbatim
        as `cursor`. A `limit` above the maximum is a `422 VALIDATION_FAILED`, not a silent
        clamp; a `cursor` this endpoint did not issue is likewise `422`.
      x-required-scopes: [audit:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            # First page.
            curl -sS 'https://scorsync.example.com/api/v1/audit-events?limit=50' \
              -H 'Authorization: Bearer 31|9pW4tZ...redacted' \
              -H 'Accept: application/json'

            # Next page — meta.next_cursor is passed back verbatim, never parsed.
            curl -sS -G 'https://scorsync.example.com/api/v1/audit-events' \
              -H 'Authorization: Bearer 31|9pW4tZ...redacted' \
              -H 'Accept: application/json' \
              --data-urlencode 'limit=50' \
              --data-urlencode 'cursor=eyJjIjoiMjAyNi0wNy0yOFQwNjowMDowMFoiLCJpIjoiMDFKOFpCMkEwQjFDMkQzRTRGNUc2SDdKOEsifQ'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - name: limit
          in: query
          required: false
          description: Maximum events to return. Above the maximum -> 422 VALIDATION_FAILED.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque keyset cursor from a previous response's `meta.next_cursor`. Omit for
            the first page. A value this endpoint did not issue -> 422 VALIDATION_FAILED.
          schema:
            type: string
      responses:
        '200':
          description: One page of audit events, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  meta:
                    $ref: '#/components/schemas/CursorPageMeta'
              examples:
                first_page:
                  $ref: '#/components/examples/AuditEventPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: |
        Laravel Sanctum personal access token, sent as `Authorization: Bearer <token>`.

        Tokens carry one or more of these **8 scopes (abilities)**:
        `lessons:read`, `lessons:write`, `lessons:cancel`, `lessons:mark-paid`,
        `athletes:read`, `athletes:create`, `balances:read`, `audit:read`.

        HTTP bearer schemes cannot enumerate scopes the way OAuth2 flows can, so the scope
        required by each operation is declared with the `x-required-scopes` extension on the
        operation and restated in its description (see the info-level scope table). A token
        missing a required scope receives `403` with code `INSUFFICIENT_SCOPE`; a token with
        the scope but denied by policy receives `403` with code `FORBIDDEN`. A missing /
        invalid / expired / revoked token is rejected by the auth layer with `401` (framework
        level, outside the 13-code application taxonomy).

        Waiver status is read-only through every scope.

  parameters:
    LessonId:
      name: id
      in: path
      required: true
      description: Lesson id.
      schema:
        type: integer
    AthleteId:
      name: id
      in: path
      required: true
      description: Athlete id.
      schema:
        type: integer
    XRequestIdRequest:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional client-supplied correlation id. If absent the server generates one. The
        value (supplied or generated) is echoed on the response `X-Request-Id` header and
        as `request_id` in any problem document.
      schema:
        type: string
      example: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated idempotency key (**required** on this endpoint). Replaying the same
        key with the same canonical body returns the stored original response; same key with
        a different body -> 409 IDEMPOTENCY_KEY_REUSED; a concurrent duplicate still in
        progress -> 409 (IDEMPOTENCY_KEY_REUSED, retryable: true). Keys expire after 24h.
      schema:
        type: string
        maxLength: 255
      example: 8f14e45f-ea0b-4d3f-9c1a-2b7d6e5f0a13
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional client-generated idempotency key. When supplied, a retry replays the stored
        original response instead of re-executing (so a lost cancel/mark-paid response can be
        safely retried). Same key + different body -> 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        maxLength: 255
      example: 4b2c9d81-6f30-4a55-9f21-0c8e77d1b4aa
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        **Required** strong ETag of the lesson version being modified, exactly as returned by
        a prior response (`"lesson-<id>-v<version>"`). Must be a strong validator (never a
        weak `W/"..."` tag). Absent -> 422 VALIDATION_FAILED; present but stale -> 412
        VERSION_MISMATCH (with `current_version` in the body).
      schema:
        type: string
      example: '"lesson-42-v3"'

  headers:
    XRequestId:
      description: Correlation id echoed on every response (client-supplied or server-generated).
      schema:
        type: string
    ETag:
      description: >-
        Strong entity tag for the returned lesson, formatted `"lesson-<id>-v<version>"`.
        Use verbatim as `If-Match` on the next write. Never weak.
      schema:
        type: string
      example: '"lesson-42-v3"'
    RetryAfter:
      description: Seconds to wait before retrying (rate limiting, and in-progress idempotent retries).
      schema:
        type: integer
        minimum: 0
    RateLimitLimit:
      description: >-
        Requests permitted per minute for this token. Emitted by the framework throttle on
        every `/api/v1` response, not only on `429`.
      schema:
        type: integer
        minimum: 1
      example: 60
    RateLimitRemaining:
      description: Requests left in the current minute for this token.
      schema:
        type: integer
        minimum: 0
      example: 58
    RateLimitReset:
      description: Unix timestamp at which the current window resets. Present on `429` only.
      schema:
        type: integer
      example: 1784717614

