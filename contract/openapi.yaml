openapi: 3.1.0
info:
  title: ScorSync Private Lessons API
  version: 1.0.0
  summary: First-party REST API (v1) for private-lesson scheduling and billing.
  description: |
    Versioned first-party REST API over the ScorSync private-lessons application
    (Laravel). This is the **frozen Phase 1 contract**: everything downstream — the
    domain layer, the endpoints, and a separately generated TypeScript MCP server + CLI —
    is built against this document. There is no runtime behaviour in this phase.

    ## Authentication
    HTTP bearer using **Laravel Sanctum personal access tokens**
    (`Authorization: Bearer <token>`). Tokens carry one or more of 8 abilities (scopes).
    See the `bearerAuth` security scheme for the scope model. Token management does not
    exist in this API by design — tokens are created only in the session-authenticated
    web UI, so an MCP/CLI client physically cannot create or elevate a token.

    A missing, invalid, expired, or revoked token is rejected by the Sanctum auth layer
    with **HTTP 401** before the application error model applies. 401 is therefore a
    framework-level response and is intentionally *not* part of the 13-code application
    error taxonomy below (none of the codes denote "unauthenticated"). Authenticated-but-
    unauthorized conditions use `403` with code `INSUFFICIENT_SCOPE` (missing scope) or
    `FORBIDDEN` (policy denies).

    ## Scope -> operation mapping
    HTTP bearer schemes cannot enumerate scopes the way OAuth2 flows can, so the required
    scope(s) for each operation are declared with the `x-required-scopes` extension on the
    operation **and** restated in the operation description. This is the single, consistent
    representation used throughout the document.

    | Operation | Required scope |
    |---|---|
    | `GET /me` | none (any valid token) |
    | `GET /lessons`, `GET /lessons/{id}` | `lessons:read` |
    | `POST /lessons`, `PATCH /lessons/{id}` | `lessons:write` |
    | `POST /lessons/{id}/cancel` | `lessons:cancel` |
    | `POST /lessons/{id}/mark-paid` | `lessons:mark-paid` |
    | `GET /availability` | `lessons:read` |
    | `GET /pricing-quotes` | `lessons:read` |
    | `GET /athletes`, `GET /athletes/{id}` | `athletes:read` |
    | `POST /athletes` | `athletes:create` |
    | `GET /balances` | `balances:read` |
    | `GET /audit-events` | `audit:read` |

    A token scope is necessary but not sufficient: the owner's policy
    (`PrivateLessonPolicy` / `AthletePolicy`) also runs per request, so removing a role or
    disabling a user takes effect on the very next call. **Waiver status is read-only
    through every scope — no scope can set it.**

    ## Timestamps (RFC 3339, explicit offset required in and out)
    Every timestamp field (`scheduled_at`, `paid_at`, `quoted_at`, `created_at`, ...) is
    RFC 3339 with an **explicit UTC offset that is required on input and always present on
    output** (e.g. `2026-08-04T14:00:00-07:00`). Naive / offset-less input
    (`2026-08-04T14:00:00` or `...Z`-less local strings) is **rejected with `422`
    `VALIDATION_FAILED`**. The server parses input as an absolute instant, converts to the
    tenant timezone (`America/Los_Angeles`), and emits RFC 3339 with an explicit Pacific
    offset. See `docs/api/contracts.md` for the boundary rule and its interim status.

    ## Request correlation
    Clients may send `X-Request-Id`; the server generates one if absent. It is echoed on
    **every** response as the `X-Request-Id` header and appears as `request_id` in every
    problem document.

    ## Errors
    All error responses use `application/problem+json` (RFC 9457) with the `ProblemDetails`
    schema. Every application error carries a `code` from the fixed 13-value enum.

    ## Rate limiting
    Per-token throttling returns `429` with `code: RATE_LIMITED` and a `Retry-After` header.
    The budget is **60 requests per minute per token** by default (`API_THROTTLE_PER_MINUTE`),
    keyed on the token id — so one token's traffic cannot exhaust another's. Every response
    also carries `X-RateLimit-Limit` and `X-RateLimit-Remaining`; a `429` adds `Retry-After`
    and `X-RateLimit-Reset`. These are framework-emitted headers and are declared on the
    `429` response only, but a client may read them on any response.
  contact:
    name: ScorSync API
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}/api/v1
    description: ScorSync instance (self-hosted). The base path is always /api/v1.
    variables:
      host:
        default: scorsync.example.com
        description: Host of the ScorSync instance.

tags:
  - name: Identity
    description: The authenticated identity and its granted scopes.
  - name: Lessons
    description: Private-lesson scheduling, updates, cancellation, and payment marking.
  - name: Availability
    description: Bookable windows for a coach on a given date.
  - name: Athletes
    description: Athlete search, lookup, and creation.
  - name: Pricing
    description: Advisory facility-fee quotes.
  - name: Balances
    description: Per-coach unpaid facility fees owed to the gym.
  - name: Audit
    description: Append-only audit log (Admin only).

security:
  - bearerAuth: []

paths:
  /me:
    get:
      operationId: getMe
      tags: [Identity]
      summary: Get the authenticated identity and token scopes.
      description: |
        Returns the token owner (user), their roles, and the abilities (scopes) granted to
        the current token. Requires only a valid token — **no specific scope**.
      x-required-scopes: []
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS https://scorsync.example.com/api/v1/me \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Accept: application/json' \
              -H 'X-Request-Id: 01J8Z9Q2K3R4S5T6U7V8W9X0Y1'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: The authenticated identity.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Me'
              examples:
                coach_token:
                  summary: A Coach's booking token (three scopes, expires in 90 days).
                  value:
                    data:
                      id: 7
                      name: Dana Smith
                      email: dana.smith@example.com
                      roles: [Coach]
                      scopes: [lessons:read, lessons:write, athletes:read]
                      token:
                        id: 12
                        name: booking-bot
                        fingerprint: a1b2c3
                        last_used_at: '2026-08-04T09:14:22-07:00'
                        expires_at: '2026-11-02T00:00:00-07:00'
        '429':
          $ref: '#/components/responses/RateLimited'

  /lessons:
    get:
      operationId: listLessons
      tags: [Lessons]
      summary: List lessons visible to the caller.
      description: |
        Returns lessons the caller may see: Admin/Management see all; Coach/Staff see only
        their own (`staff_id == token owner`). Requires scope `lessons:read`.

        Date filters `from`/`to` are calendar dates interpreted in the tenant timezone
        (`America/Los_Angeles`).
      x-required-scopes: [lessons:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS 'https://scorsync.example.com/api/v1/lessons?from=2026-08-03&to=2026-08-09&paid=false' \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Accept: application/json'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (Pacific calendar date) on `scheduled_at`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (Pacific calendar date) on `scheduled_at`.
          schema:
            type: string
            format: date
        - name: coach
          in: query
          required: false
          description: Filter by coach (staff) user id. Coach/Staff tokens are always scoped to themselves regardless of this value.
          schema:
            type: integer
        - name: paid
          in: query
          required: false
          description: Filter by payment status (`true` = has `paid_at`, `false` = unpaid).
          schema:
            type: boolean
        - name: athlete
          in: query
          required: false
          description: Filter to lessons that include this athlete id.
          schema:
            type: integer
      responses:
        '200':
          description: Matching lessons.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lesson'
              examples:
                lessons:
                  $ref: '#/components/examples/LessonList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createLesson
      tags: [Lessons]
      summary: Create a lesson.
      description: |
        Books a lesson for one or more athletes with a coach. Requires scope
        `lessons:write`.

        **No athlete name field exists.** The request accepts `athlete_ids` only; there is
        no code path where a write can guess an identity, so `ATHLETE_AMBIGUOUS` can never
        be raised here (it is a *search* result on `GET /athletes`). A missing athlete must
        be created first with `POST /athletes`.

        **Idempotency:** the `Idempotency-Key` header is **required**. Replaying the same
        key with the same canonical body returns the stored original response (a fresh
        `request_id` is minted). Same key + different body -> `409 IDEMPOTENCY_KEY_REUSED`.
        A concurrent duplicate that arrives while the first is still in flight -> `409`
        (code `IDEMPOTENCY_KEY_REUSED`, `retryable: true`, `Retry-After` set).

        **Acknowledgements:** `fee_acknowledged: true` is required (else `422`
        `FACILITY_FEE_ACK_REQUIRED`); `late_booking_acknowledged: true` is required **when
        the booking is late** (else `422 LATE_BOOKING_ACK_REQUIRED`). Both are recorded in
        the audit event.

        On success the response carries a strong `ETag` (`"lesson-<id>-v<version>"`).
      x-required-scopes: [lessons:write]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS -X POST https://scorsync.example.com/api/v1/lessons \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'Idempotency-Key: 8f14e45f-ea0b-4d3f-9c1a-2b7d6e5f0a13' \
              -d '{
                    "coach_id": 7,
                    "athlete_ids": [12],
                    "scheduled_at": "2026-08-04T14:00:00-07:00",
                    "duration_minutes": 60,
                    "fee_acknowledged": true,
                    "notes": "Working bar routine."
                  }'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
            examples:
              standard:
                $ref: '#/components/examples/CreateLessonBody'
              late_booking:
                $ref: '#/components/examples/CreateLessonLateBody'
      responses:
        '201':
          description: Lesson created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Lesson'
              examples:
                created:
                  $ref: '#/components/examples/LessonCreated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LessonCreateConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /lessons/{id}:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    get:
      operationId: getLesson
      tags: [Lessons]
      summary: Get a single lesson.
      description: |
        Returns one lesson if the caller may view it. Requires scope `lessons:read`.
        The response carries a strong `ETag` (`"lesson-<id>-v<version>"`) for use as
        `If-Match` on subsequent writes.
      x-required-scopes: [lessons:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            # -D - prints the response headers, which is where the ETag you will
            # send back as If-Match lives.
            curl -sS -D - https://scorsync.example.com/api/v1/lessons/42 \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Accept: application/json'
            # ETag: "lesson-42-v3"
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
      responses:
        '200':
          description: The lesson.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Lesson'
              examples:
                lesson:
                  $ref: '#/components/examples/LessonDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateLesson
      tags: [Lessons]
      summary: Update a lesson.
      description: |
        Partially updates a lesson. Requires scope `lessons:write`.

        **No athlete name field exists** — reassign athletes with `athlete_ids` only.

        **Absent vs null:** an omitted field is left unchanged; a field sent explicitly as
        `null` clears it (applies to the nullable fields `notes` and `observer`). Non-
        nullable fields cannot be sent as `null`.

        **Optimistic concurrency:** the `If-Match` header is **required** and must carry
        the strong ETag of the version being modified. If `If-Match` is absent -> `422`
        `VALIDATION_FAILED`; if present but stale -> `412 VERSION_MISMATCH` with
        `current_version` in the body. On success the version is incremented and a new
        strong `ETag` is returned.

        If a reschedule moves the lesson to a late-booking start, `late_booking_acknowledged:
        true` is required (else `422 LATE_BOOKING_ACK_REQUIRED`).
      x-required-scopes: [lessons:write]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            # If-Match is the strong ETag from the read, sent back verbatim
            # (quotes included).
            curl -sS -X PATCH https://scorsync.example.com/api/v1/lessons/42 \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'If-Match: "lesson-42-v3"' \
              -d '{"scheduled_at": "2026-08-04T14:30:00-07:00", "notes": null}'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
            examples:
              reschedule_and_clear_notes:
                $ref: '#/components/examples/UpdateLessonBody'
      responses:
        '200':
          description: Lesson updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Lesson'
              examples:
                updated:
                  $ref: '#/components/examples/LessonUpdated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SlotConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /lessons/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    post:
      operationId: cancelLesson
      tags: [Lessons]
      summary: Cancel a lesson.
      description: |
        Cancels (soft-deletes) a lesson. Requires scope `lessons:cancel`.

        **Optimistic concurrency:** `If-Match` is **required** (absent -> `422`
        `VALIDATION_FAILED`; stale -> `412 VERSION_MISMATCH`).

        **Idempotency:** `Idempotency-Key` is **accepted** (optional). A lost response
        followed by a retry replays the original `200` rather than returning `404` on the
        now-cancelled lesson.

        The response returns the lesson in its final (cancelled) state with an updated
        strong `ETag`.
      x-required-scopes: [lessons:cancel]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS -X POST https://scorsync.example.com/api/v1/lessons/42/cancel \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'If-Match: "lesson-42-v3"' \
              -H 'Idempotency-Key: 4b2c9d81-6f30-4a55-9f21-0c8e77d1b4aa' \
              -d '{"reason": "Athlete is ill."}'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelLessonRequest'
            examples:
              with_reason:
                $ref: '#/components/examples/CancelLessonBody'
      responses:
        '200':
          description: Lesson cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Lesson'
              examples:
                cancelled:
                  $ref: '#/components/examples/LessonCancelled'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /lessons/{id}/mark-paid:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    post:
      operationId: markLessonPaid
      tags: [Lessons]
      summary: Mark a lesson as paid.
      description: |
        Records payment of the facility fee for a lesson. Requires scope
        `lessons:mark-paid`.

        **Optimistic concurrency:** `If-Match` is **required** (absent -> `422`
        `VALIDATION_FAILED`; stale -> `412 VERSION_MISMATCH`).

        **Idempotency:** `Idempotency-Key` is **accepted** (optional); a retry replays the
        original `200`.

        The response returns the lesson with `paid_at` set and an updated strong `ETag`.
      x-required-scopes: [lessons:mark-paid]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS -X POST https://scorsync.example.com/api/v1/lessons/42/mark-paid \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'If-Match: "lesson-42-v3"' \
              -H 'Idempotency-Key: 1d90f7c3-55a2-4b18-8e77-b6a0c2f4e9d1' \
              -d '{"paid_at": "2026-08-04T15:10:00-07:00"}'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkLessonPaidRequest'
            examples:
              explicit_time:
                $ref: '#/components/examples/MarkLessonPaidBody'
      responses:
        '200':
          description: Lesson marked paid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Lesson'
              examples:
                marked_paid:
                  $ref: '#/components/examples/LessonMarkedPaid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /availability:
    get:
      operationId: getAvailability
      tags: [Availability]
      summary: Bookable windows for a coach on a date.
      description: |
        Given a date, lesson duration, and coach, returns bookable windows =
        business hours (07:00-22:00 Pacific) minus that coach's existing lessons, in
        `America/Los_Angeles`, with late-booking starts flagged. Requires scope
        `lessons:read`.

        These are **not** the family booking-site "posted slots" (out of scope).
      x-required-scopes: [lessons:read]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -sS 'https://scorsync.example.com/api/v1/availability?date=2026-08-04&duration=60&coach=7' \
              -H 'Authorization: Bearer 12|kR8pQ2vX...redacted' \
              -H 'Accept: application/json'
      parameters:
        - $ref: '#/components/parameters/XRequestIdRequest'
        - name: date
          in: query
          required: true
          description: Pacific calendar date to compute availability for.
          schema:
            type: string
            format: date
        - name: duration
          in: query
          required: true
          description: Lesson duration in minutes.
          schema:
            $ref: '#/components/schemas/DurationMinutes'
        - name: coach
          in: query
          required: false
          description: Coach (staff) user id. Defaults to the token owner for Coach/Staff tokens.
          schema:
            type: integer
      responses:
        '200':
          description: Availability for the requested date/coach.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Availability'
              examples:
                availability:
                  $ref: '#/components/examples/AvailabilityDay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /athletes:
    get:
      operationId: searchAthletes
      tags: [Athletes]
      summary: Search athletes by name.
      description: |
        Searches athletes by name and returns the matching **candidates**. Requires scope
        `athletes:read`.

        A search that matches multiple athletes returns all of them here with `200` — a
        search returning matches is not an error. Because the server cannot know caller intent
        (a user browsing vs. an agent resolving a name to one id), it never emits ambiguity as
        an HTTP error. `ATHLETE_AMBIGUOUS` is **client-surfaced**: a CLI/MCP client performing
        single-athlete resolution treats a `>1` result as `ATHLETE_AMBIGUOUS` and requires the
        caller to choose an id before writing. It is **never** a write error — writes take
        `athlete_ids` only.

        **Field visibility depends on the caller's role, not scope:** Coach/Staff tokens
        receive only `id`, `name`, `waiver_signed`, `membership_status` (never `notes`);
        Admin/Management receive the full record including `notes`.
      x-required-scopes: [athletes:read]
